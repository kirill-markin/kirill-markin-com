name: Metadata Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        
    - name: Install dependencies
      run: npx --yes npm@12.0.2 ci
      
    - name: Run frontmatter validation
      run: npm run validate-frontmatter

    - name: Run metadata validation
      run: npm run validate-metadata
      
    - name: Report validation results
      if: failure()
      run: |
        echo "❌ Validation failed!"
        echo "Please check the output above: it lists every file and every problem found."
        echo "Frontmatter rules are documented in src/content/README.md."
        echo "SEO metadata rules: titles 50-70 characters, descriptions 140-160 characters, no duplicates, present on every page." 
